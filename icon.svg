<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="80" fill="#09152A"/>

  <!-- Clipboard body (rounded rectangle) -->
  <rect x="128" y="120" width="256" height="320" rx="24" ry="24"
    fill="none" stroke="#00C8FF" stroke-width="18" stroke-linejoin="round"/>

  <!-- Clipboard clip base (rectangle at top center) -->
  <rect x="200" y="88" width="112" height="56" rx="12" ry="12"
    fill="#09152A" stroke="#00C8FF" stroke-width="18"/>

  <!-- Clipboard clip circle (hole at top) -->
  <circle cx="256" cy="108" r="14" fill="#09152A" stroke="#00C8FF" stroke-width="10"/>

  <!-- ECG/Heartbeat line inside clipboard -->
  <polyline
    points="160,310 210,310 225,290 240,310 252,310 262,260 275,370 290,280 300,310 340,310 360,310"
    fill="none" stroke="#00C8FF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
